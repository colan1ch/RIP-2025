<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/static/styles/indexes_page_style.css" />
  </head>
  <body>
    <div class="main-page">
      <div class="main">
        <div class="frame">
          <div class="grid-container">
            <div class="search-content-list">
              <form class="search-content-list" method="get" action="/indexes">
                  <div class="search-icon"><img class=search-icon src="/static/img/search_icon.svg"></div>
                  <div class="div-wrapper"><input type="text" name="indexSearch" class="text-wrapper" placeholder="Поиск по названию" value="{{.query}}" /></div>
                  <button type="submit" style="display:none"></button>
                </form>
            </div>
            {{if not .indexes}}
            <div class="not-found-message">По вашему запросу ничего не найдено</div>
            {{else}}
            {{range .indexes}}
            <div class="frame-2">
              <a href="/indexes/{{.ID}}">
                <div class="b-tree-index"><div class="b-tree-index-2">{{.Name}}</div></div>
                <div class="card-wrapper"><img class="card" src="{{.Image}}" /></div>
              </a>
              <p class="p">{{.Description}}</p>
              <form action="/indexes/{{ .ID }}/add-to-query" style="width: 260px; margin-left: 0;" method="post">
                <button type="submit" class="rectangle">Добавить в заявку</button>
              </form>
            </div>
            {{end}}
            {{end}}
          </div>
        </div>
      </div>
      <div class="frame-9">
        <a href="/queries/{{.queryId}}">
        <img class="image-2" src="/static/img/file_icon.svg" />
        </a>
        <div class="text-wrapper-8">{{.queryCount}}</div>
      </div>
      <div class="logo-no-bg-preview-wrapper">
        <a href="/indexes">
        <img class="logo-no-bg-preview" src="/static/img/logo.png" />
        </a>
      </div>
      <div class="frame-10"></div>
    </div>
  </body>
</html>
