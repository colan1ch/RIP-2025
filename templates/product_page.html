<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Product Page</title>
    <link rel="stylesheet" href="/static/styles/globals.css" />
  <link rel="stylesheet" href="/static/styles/style.css" />
  </head>
  <body>
  <div class="macbook-air product-page">
      <div class="div">
        <header class="frame-2" role="banner" aria-label="Top navigation bar"></header>
        <div class="frame-wrapper">
          <div class="logo-no-bg-preview-wrapper">
            <a href="/indexes" aria-label="Open home page">
            <img class="logo-no-bg-preview" src="http://127.0.0.1:9000/sqlanalyzer/logo.png" alt="Company logo" /></a>
          </div>
        </div>
        <main class="main" role="main">
          <section class="frame">
            <article class="grid-container">
                <h1 class="text-wrapper">{{ .index.Name }}</h1>
                <figure>
                  <img
                    class="image"
                    src="{{ .index.Image }}"
                    alt="{{ .index.Name }}"
                  />
                </figure>
                <div class="b-tree-balanced-tree">
                  <p>{{ .index.Description }}</p>
                  <!-- <p><b>Cardinality:</b> {{ .index.Cardinality }}</p>
                  <p><b>Количество строк в таблице:</b> {{ .index.RowsCount }}</p> -->
                </div>
            </article>
          </section>
        </main>
      </div>
    </div>
    <script>
      (function () {
        var frame = document.querySelector('.macbook-air .frame-wrapper');
        if (!frame) return;
        var onScroll = function () {
          var y = window.scrollY || window.pageYOffset;
          if (y > 20) frame.classList.add('small');
          else frame.classList.remove('small');
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
      })();
    </script>
  </body>
</html>
